<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayControl — Sign In</title>
  <style>
    /* ========================================
       CSS Reset + Base Styles
       ======================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: #f8f9fa;
    }

    /* ========================================
       Left Panel: Branding
       ======================================== */
    .brand-panel {
      flex: 1.1;
      background: linear-gradient(160deg, #e8f2fb 0%, #cfe4f5 45%, #9ec3e0 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 60px;
      overflow: hidden;
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.6), transparent 60%);
    }

    .brand-panel h1 {
      color: #0b1f3a;
      font-size: 2.2rem;
      font-weight: 700;
      z-index: 1;
      max-width: 400px;
      line-height: 1.3;
    }

    .brand-panel p {
      color: #274a6d;
      margin-top: 12px;
      max-width: 400px;
      line-height: 1.6;
      z-index: 1;
    }

    /* ========================================
       Right Panel: Login Form
       ======================================== */
    .form-panel {
      flex: 1;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .form-wrap {
      width: 100%;
      max-width: 360px;
    }

    /* ========================================
       Logo
       ======================================== */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #1a4d7a, #4aa3d8);
      border-radius: 10px;
      position: relative;
    }

    .logo-mark::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: #fff;
      border-radius: 6px;
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0b1f3a;
    }

    .logo-text span {
      color: #3a8ec7;
    }

    /* ========================================
       Form Styles
       ======================================== */
    .form-wrap h2 {
      font-size: 1.5rem;
      color: #0b1f3a;
      margin-bottom: 6px;
    }

    .form-wrap .subtitle {
      color: #6b7c93;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #3a4a5e;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dce4ec;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #3a8ec7;
      box-shadow: 0 0 0 3px rgba(58, 142, 199, 0.15);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .row a {
      font-size: 0.85rem;
      color: #3a8ec7;
      text-decoration: none;
    }

    .row a:hover {
      text-decoration: underline;
    }

    .row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
      font-size: 0.85rem;
      color: #6b7c93;
      margin: 0;
    }

    button.submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0b1f3a, #1a4d7a);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button.submit:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button.submit:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      font-size: 0.8rem;
      color: #9aa8ba;
    }

    /* ========================================
       Legal Links
       ======================================== */
    .legal-link {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: #9aa8ba;
    }

    .legal-link a {
      color: #3a8ec7;
      text-decoration: none;
      margin: 0 4px;
    }

    .legal-link a:hover {
      text-decoration: underline;
    }

    /* ========================================
       Responsive Design
       ======================================== */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .brand-panel {
        padding: 40px 20px;
        min-height: 200px;
      }

      .form-panel {
        padding: 20px;
      }

      .brand-panel h1 {
        font-size: 1.5rem;
      }

      .brand-panel p {
        font-size: 0.9rem;
      }
    }

    /* ========================================
       Loading Spinner (for form submission)
       ======================================== */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn-disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>

  <!-- Sentry for error tracking -->
  <script src="https://browser.sentry-cdn.com/7.0.0/bundle.min.js" crossorigin="anonymous"></script>
  <script>
    Sentry.init({ dsn: 'YOUR_SENTRY_DSN' });
  </script>

  <!-- Plausible for analytics -->
  <script defer data-domain="app.yourdomain.com" src="https://plausible.io/js/script.js"></script>
</head>

<body>
  <div class="brand-panel">
    <h1>Payments & Financial Security, unified.</h1>
    <p>Centralized control over every gateway, every transaction, every compliance flag — in one platform.</p>
  </div>

  <div class="form-panel">
    <div class="form-wrap">
      <div class="logo">
        <div class="logo-mark"></div>
        <div class="logo-text">Pay<span>Control</span></div>
      </div>

      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to your PayControl dashboard</p>

      <form id="loginForm" class="form-stack">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@company.com" required autofocus />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required minlength="8" />

        <div class="row">
          <label><input type="checkbox" id="remember" name="remember"> Remember me</label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="submit" id="submitBtn">
          <span id="btnText">Sign In</span>
          <span id="spinner" class="spinner" style="display: none;"></span>
        </button>
      </form>

      <p class="legal-link">
        <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a>
      </p>

      <p class="footer-note">Secured by atrpay · SwiftWave Holdings</p>
    </div>
  </div>

  <!-- jQuery (already in your original) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-3gJwYp4GjhA4/OdGQOQF3K3/Qz4aVh+8QPp3c1i0qLc=" crossorigin="anonymous"></script>

  <!-- Your existing scripts -->
  <script src="scripts/api.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/main.js"></script>

  <!-- Enhanced Login Logic (replaces default form behavior) -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');

      // Show loading state
      btnText.style.display = 'none';
      spinner.style.display = 'inline-block';
      submitBtn.disabled = true;
      submitBtn.classList.add('btn-disabled');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      try {
        const response = await fetch('https://api.yourdomain.com/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          credentials: 'include'  // Required for httpOnly cookies
        });

        if (!response.ok) {
          const error = await response.json();
          alert(error.message || 'Login failed. Please check your credentials.');
          return;
        }

        const { user } = await response.json();
        // Redirect to dashboard on success
        window.location.href = '/';
      } catch (error) {
        alert('An error occurred. Please try again.');
        console.error('Login error:', error);
      } finally {
        // Reset button state
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-disabled');
      }
    });
  </script>
</body>

</html>
