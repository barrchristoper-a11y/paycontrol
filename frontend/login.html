<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PayControl Login</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body data-page="login">
  <main class="login-shell">
    <section class="login-card">
      <h1>Sign in to PayControl</h1>
      <form id="loginForm" class="form-stack">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8" />

        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
      <p class="legal-link"><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a></p>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-3gJwYp4GjhA4/OdGQOQF3K3/Qz4aVh+8QPp3c1i0qLc=" crossorigin="anonymous"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
