<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayControl Login</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <style>
    /* Add loading spinner */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body data-page="login">
  <main class="login-shell">
    <section class="login-card">
      <h1>Sign in to PayControl</h1>
      <form id="loginForm" class="form-stack">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8" />

        <button type="submit" class="btn btn-primary">
          <span id="button-text">Sign in</span>
          <div id="button-spinner" class="spinner"></div>
        </button>
      </form>
      <p class="legal-link"><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a></p>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/main.js"></script>

  <!-- ✅ NEW: CSRF Handling -->
  <script>
    $(document).ready(function () {
      // ✅ Step 1: Get CSRF token first
      async function getCsrfToken() {
        try {
          const response = await fetch('https://paycontrol-backend.onrender.com/api/csrf-token', {
            credentials: 'include'
          });
          if (!response.ok) throw new Error('Failed to get CSRF token');
          const { csrfToken } = await response.json();
          return csrfToken;
        } catch (error) {
          console.error('CSRF token error:', error);
          return null;
        }
      }

      // ✅ Step 2: Handle login with CSRF
      $('#loginForm').on('submit', async function (e) {
        e.preventDefault();
        const email = $('#email').val();
        const password = $('#password').val();

        $('#button-text').hide();
        $('#button-spinner').show();

        try {
          const csrfToken = await getCsrfToken();
          if (!csrfToken) {
            alert('Security error. Please refresh the page.');
            return;
          }

          const response = await fetch('https://paycontrol-backend.onrender.com/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRF-Token': csrfToken  // ✅ Send CSRF token
            },
            body: JSON.stringify({ email, password }),
            credentials: 'include'
          });

          if (!response.ok) {
            const error = await response.json();
            alert(error.message || 'Login failed. Please check your credentials.');
            return;
          }

          window.location.href = '/dashboard.html';
        } catch (error) {
          alert(`Login error: ${error.message}`);
          console.error('Login error:', error);
        } finally {
          $('#button-text').show();
          $('#button-spinner').hide();
        }
      });
    });
  </script>
</body>

</html>
